    needs: [guard, verdict-1, verdict-2]
    if: ${{ !cancelled() && needs.guard.outputs.proceed == 'true' && needs.verdict-1.outputs.ok != 'true' && needs.verdict-2.outputs.ok != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
    outputs:
      sha: ${{ steps.save.outputs.sha }}
      has_patch: ${{ steps.save.outputs.has_patch }}
