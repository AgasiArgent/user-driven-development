          rm -rf .git/hooks
          git add -A
          git diff --cached --binary --no-renames --no-ext-diff --no-textconv > "$out/agent.patch"
          echo "sha=$(sha256sum "$out/agent.patch" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          if [ -s "$out/agent.patch" ]; then echo "has_patch=true" >> "$GITHUB_OUTPUT"; else echo "has_patch=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: patch-2
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  # No model token, no write token, no cache: project code runs here, and in the preview workflow, and nowhere else.
  red-2:
    needs: [guard, agent-2]
    if: ${{ !cancelled() && needs.agent-2.outputs.has_patch == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXPECTED: ${{ needs.agent-2.outputs.sha }}
      TEST_GLOB: ${{ vars.UDD_TEST_GLOB || '**/*.spec.ts,**/*.test.ts,e2e/**' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: patch-2
          path: ${{ runner.temp }}/in

      # The pattern is computed by the script of the base commit, before anything from the patch is in the tree.
