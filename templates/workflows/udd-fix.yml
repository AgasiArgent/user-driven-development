    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXPECTED: ${{ needs.agent-3.outputs.sha }}
      TEST_GLOB: ${{ vars.UDD_TEST_GLOB || '**/*.spec.ts,**/*.test.ts,e2e/**' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: patch-3
          path: ${{ runner.temp }}/in

      # The pattern is computed by the script of the base commit, before anything from the patch is in the tree.
      - name: Verify the patch and keep only its test files
        run: |
          actual=$(sha256sum "$RUNNER_TEMP/in/agent.patch" | cut -d' ' -f1)
          [ -n "$EXPECTED" ] && [ "$actual" = "$EXPECTED" ] || { echo "::error::patch sha256 differs from the agent job output"; exit 1; }
          echo "REGEX=$(node .udd/scripts/red-first.mjs regex "@udd-$ISSUE")" >> "$GITHUB_ENV"
          specs=()
          IFS=',' read -ra globs <<< "$TEST_GLOB"
          for g in "${globs[@]}"; do g="${g// /}"; [ -n "$g" ] && specs+=(":(glob)$g"); done
          [ "${#specs[@]}" -gt 0 ] || { echo "::error::UDD_TEST_GLOB is empty"; exit 1; }
          git apply --index "$RUNNER_TEMP/in/agent.patch"
          git diff --cached --binary --no-renames --no-ext-diff --no-textconv -- "${specs[@]}" > "$RUNNER_TEMP/tests.patch"
          git reset -q --hard HEAD
          if [ -s "$RUNNER_TEMP/tests.patch" ]; then git apply --index "$RUNNER_TEMP/tests.patch"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npx playwright install --with-deps chromium

      # Only here do the test account secrets exist, and only for the test run.
      - name: Run the tagged test on production
        env:
          E2E_CMD: ${{ vars.UDD_E2E_CMD || 'npx playwright test' }}
          PLAYWRIGHT_BASE_URL: ${{ vars.UDD_PROD_URL }}
          UDD_TEST_USER_EMAIL: ${{ secrets.UDD_TEST_USER_EMAIL }}
          UDD_TEST_USER_PASSWORD: ${{ secrets.UDD_TEST_USER_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/report/base.json" bash -c "$E2E_CMD"' --grep "$0" --reporter=json' "$REGEX" > "$RUNNER_TEMP/e2e.log" 2>&1 || true
          jq -e . "$RUNNER_TEMP/report/base.json" > /dev/null 2>&1 || echo '{}' > "$RUNNER_TEMP/report/base.json"
      - uses: actions/upload-artifact@v4
        with:
          name: base-3
          path: ${{ runner.temp }}/report
          if-no-files-found: error

  # Runs no project code. Everything it executes is a copy taken from the base commit before the patch exists here.
  publish:
    needs: [guard, agent-1, agent-2, agent-3, red-1, red-2, red-3, verdict-1, verdict-2]
    if: ${{ !cancelled() && needs.guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA_1: ${{ needs.agent-1.outputs.sha }}
      SHA_2: ${{ needs.agent-2.outputs.sha }}
      SHA_3: ${{ needs.agent-3.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.base }}

      # The scripts and their list come from the base commit: the patch cannot change them.
      - name: Keep a trusted copy of the scripts
        run: |
          mkdir -p "$RUNNER_TEMP/trusted"
          cp .udd/scripts/red-first.mjs .udd/scripts/no-fly-check.mjs .udd/no-fly.txt "$RUNNER_TEMP/trusted/"

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: patch-*
          path: ${{ runner.temp }}/in
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: base-*
          path: ${{ runner.temp }}/in

      # The first attempt whose patch is intact and whose test is red on production wins.
      - name: Pick the winning attempt
        id: pick
        run: |
          in="$RUNNER_TEMP/in"
          winner=0; summary=""
          for n in 1 2 3; do
            eval "expected=\$SHA_$n"
            if [ ! -s "$in/patch-$n/agent.patch" ]; then reason="no-changes"
            elif [ "$(sha256sum "$in/patch-$n/agent.patch" | cut -d' ' -f1)" != "$expected" ] || [ -z "$expected" ]; then reason="patch-sha-mismatch"
            elif [ ! -f "$in/base-$n/base.json" ]; then reason="red-run-failed"
            elif reason=$(node "$RUNNER_TEMP/trusted/red-first.mjs" base "$in/base-$n/base.json" "@udd-$ISSUE"); then
              winner=$n; summary="${summary}attempt $n: red on production; "; break
            fi
            reason=$(printf %s "$reason" | tr -cd 'a-z0-9-' | head -c 40)
            summary="${summary}attempt $n: ${reason:-unknown}; "
          done
          echo "winner=$winner" >> "$GITHUB_OUTPUT"
          echo "summary=${summary%; }" >> "$GITHUB_OUTPUT"

      # Three failed attempts (or a crashed job): no PR, a human takes over.
      - name: Ask for a human
        if: steps.pick.outputs.winner == '0'
        env:
          SUMMARY: ${{ steps.pick.outputs.summary }}
        run: |
          {
            echo "The coding agent could not produce a test that fails on production, so no pull request was opened."
            echo
            echo "Result per attempt: ${SUMMARY:-the agent jobs did not finish}"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
          gh issue edit "$ISSUE" --add-label needs-human --remove-label in-progress

      - name: Apply the winning patch
        if: steps.pick.outputs.winner != '0'
        env:
          WINNER: ${{ steps.pick.outputs.winner }}
        run: |
          git switch -c "$BRANCH"
          git apply --index "$RUNNER_TEMP/in/patch-$WINNER/agent.patch"

      # No-fly zones are checked in code, on what will actually be committed.
      - name: No-fly zones
        if: steps.pick.outputs.winner != '0'
        run: |
          git -c core.quotePath=false diff --cached --name-only -z --no-renames > "$RUNNER_TEMP/changed.list"
          if ! node "$RUNNER_TEMP/trusted/no-fly-check.mjs" -z "$RUNNER_TEMP/trusted/no-fly.txt" < "$RUNNER_TEMP/changed.list" > "$RUNNER_TEMP/nofly.txt"; then
            { echo "The coding agent changed files in no-fly zones, so no PR was opened. A human needs to make this change."; echo; cat "$RUNNER_TEMP/nofly.txt"; } > "$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
            gh issue edit "$ISSUE" --add-label needs-human --remove-label in-progress
            exit 1
          fi

      # The agent stops at a draft PR; a human reviews and merges. The label stays in-progress:
      # the fix itself is not checked until its preview deployment exists (udd-preview.yml).
      - name: Draft pull request
        if: steps.pick.outputs.winner != '0'
        env:
          TITLE: ${{ github.event.issue.title }}
          SUMMARY: ${{ steps.pick.outputs.summary }}
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Fix #$ISSUE (from approved feedback, written by the coding agent)"
          git push -q origin "$BRANCH"
          {
            echo "Fixes #$ISSUE"
            echo
            echo "Written by the coding agent from approved user feedback. Review it like any other change before merging."
            echo
            echo "Red check: the new \`@udd-$ISSUE\` test fails on production. It must still pass on the preview deployment of this PR; that check follows."
            echo "Result per attempt: $SUMMARY"
          } > "$RUNNER_TEMP/pr.md"
          gh pr create --draft --head "$BRANCH" --title "Fix #$ISSUE: ${TITLE:0:80}" --body-file "$RUNNER_TEMP/pr.md"
          gh issue comment "$ISSUE" --body "A draft pull request is open. The new test fails on production as expected. The preview check will follow once the preview deployment of the pull request is ready."

  shipped:
    # A merged udd/fix-* PR from this repository: its issue is now shipped.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'udd/fix-')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - run: |
          case "$HEAD_REF" in
            udd/fix-[0-9]*) n="${HEAD_REF#udd/fix-}" ;;
            *) exit 0 ;;
          esac
          case "$n" in *[!0-9]*) echo "Unexpected branch name"; exit 1 ;; esac
          gh issue edit "$n" --add-label shipped --remove-label fix-ready
