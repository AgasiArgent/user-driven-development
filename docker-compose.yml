services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: udd
      POSTGRES_PASSWORD: udd
      POSTGRES_DB: udd
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udd -d udd"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    environment:
      DATABASE_URL: postgres://udd:udd@db:5432/udd
    ports:
      - "3100:3100"
    depends_on:
      db:
        condition: service_healthy
